# Market Report Configuration

defensive_exceptions: false

symbols:
  indices:
    - symbol: "^GSPC"
      name: "S&P 500"
    - symbol: "^IXIC"
      name: "Nasdaq Composite"
    - symbol: "^NDX"
      name: "Nasdaq-100"
    - symbol: "^DJI"
      name: "Dow Jones Industrial Average"
    - symbol: "^RUT"
      name: "Russell 2000"
  
  technical_indices:
    - symbol: "^GSPC"
      name: "S&P 500"
    - symbol: "^NDX"
      name: "Nasdaq-100"

  volatility:
    symbol: "^VIX"
    name: "Cboe Volatility Index"

  volatility_3m:
    symbol: "^VIX3M"
    name: "Cboe 3-Month Volatility Index"

  sectors:
    - symbol: "XLK"
      name: "Technology"
    - symbol: "XLF"
      name: "Financials"
    - symbol: "XLE"
      name: "Energy"
    - symbol: "XLV"
      name: "Health Care"
    - symbol: "XLY"
      name: "Consumer Discretionary"
    - symbol: "XLP"
      name: "Consumer Staples"
    - symbol: "XLI"
      name: "Industrials"
    - symbol: "XLB"
      name: "Materials"
    - symbol: "XLU"
      name: "Utilities"
    - symbol: "XLRE"
      name: "Real Estate"
    - symbol: "XLC"
      name: "Communication Services"

  benchmark:
    symbol: "SPY"
    name: "SPDR S&P 500 ETF Trust"

indicators:
  dma_fast: 20
  dma_medium: 50
  dma_slow: 200
  rsi_period: 14
  rsi_overbought: 70.0
  rsi_oversold: 30.0
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  adx_period: 14

scoring:
  weights:
    price_above_50_dma: 1.0
    price_above_200_dma: 1.0
    dma_50_above_200: 1.0
    macd_bullish: 1.0
    vix_bullish: 1.0
  min_inputs_per_category: 2
  mixed_verdict_spread_threshold: 0.8
  thresholds:
    bullish: 0.3
    bearish: -0.3
  vix:
    cautious_threshold: 16.5
    low_threshold: 20.0
    high_threshold: 25.0

scorecard_categories:
  enabled: true
  weights:
    trend_price: 0.30
    breadth: 0.20
    volatility_risk: 0.15
    rates_macro: 0.20
    sentiment_positioning: 0.15
  regimes:
    risk_on: 0.40
    constructive: 0.15
    neutral_lower: -0.15
    cautious_lower: -0.40

movers:
  min_price: 5.0
  min_avg_volume: 1000000       # 1M shares minimum 20-day average
  min_market_cap: 2000000000    # $2B minimum market cap
  top_n: 5

breadth:
  enabled: true
  min_coverage_pct: 95.0
  min_history_bars: 252
  mcclellan_enabled: true
  scoring:
    enabled: true
    weights:
      stocks_above_50_dma: 0.5
      stocks_above_200_dma: 0.5
      net_new_highs: 0.5
      narrow_leadership: 0.5
      ad_line_confirmation: 0.5
    thresholds:
      ma_bullish_pct: 60.0
      ma_bearish_pct: 40.0
      net_highs_strongly_negative: -10.0
      narrow_leadership_margin_pct: 1.0
      narrow_leadership_margin_daily_pct: 0.75
      narrow_leadership_margin_weekly_pct: 1.25
      narrow_leadership_margin_monthly_pct: 2.50
      rsp_vs_spy_scoring: "directional_breadth" # Broad leadership (RSP outperformance) is positive; defensive rotation capped at +0.30 if market down
      event_risk_window_days: 3 # Trading days before high-impact catalyst to cap posture

data:
  cache_dir: ".cache"
  constituents_cache_days: 7
  request_delay_seconds: 0.05
  max_retries: 3
  backoff_factor: 1.5
  batch_size: 50
  snapshot_db_path: ".cache/snapshots.db"

macro:
  enabled: true
  fred:
    api_key_env: "FRED_API_KEY"
    cache_days: 7
    series:
      cpi: "CPIAUCSL"
      core_cpi: "CPILFESL"
      ppi: "PPIFIS"
      pce: "PCEPI"
      core_pce: "PCEPILFE"
      payrolls: "PAYEMS"
      unemployment: "UNRATE"
      jobless_claims: "ICSA"
      jolts: "JTSJOL"
      retail_sales: "RSAFS"
      gdp: "GDPC1"
      consumer_sentiment: "UMCSENT"
      yield_2y: "DGS2"
      yield_10y: "DGS10"
      spread_2s10s: "T10Y2Y"
      fed_funds: "DFF"
      hy_credit_spread: "BAMLH0A0HYM2"
      real_yield_10y: "DFII10"
      breakeven_10y: "T10YIE"
      wti_oil: "DCOILWTICO"
      broad_dollar: "DTWEXBGS"
  calendar:
    provider: "finnhub"
    finnhub_api_key_env: "FINNHUB_API_KEY"
    fmp_api_key_env: "FMP_API_KEY"
    cache_hours: 12
  cross_assets:
    dollar_index: "DX-Y.NYB"
    wti_oil: "CL=F"
    gold: "GC=F"
  tolerances:
    inflation_mom: 0.05       # % points
    payrolls: 25.0            # thousands
    retail_sales: 0.1         # % points
    gdp: 0.2                  # % points
  scoring:
    enabled: true
    weights:
      yield_10y_surge: 0.5
      curve_inversion: 0.5
      dollar_surge: 0.5
      inflation_surprise: 0.5
      labor_surprise: 0.5
    thresholds:
      yield_10y_surge_bps: 15.0 # Basis points change over period (default fallback)
      yield_10y_surge_daily_bps: 10.0
      yield_10y_surge_weekly_bps: 15.0
      yield_10y_surge_monthly_bps: 25.0
      dollar_surge_pct: 1.0     # % change over period (default fallback)
      dollar_surge_daily_pct: 0.75
      dollar_surge_weekly_pct: 1.25
      dollar_surge_monthly_pct: 2.00

charts:
  enabled: true
  dpi: 120
  lookback_bars: 130
  monthly_lookback_bars: 252

email:
  enabled: false
  smtp_host_env: "SMTP_HOST"
  smtp_port_env: "SMTP_PORT"
  smtp_user_env: "SMTP_USER"
  smtp_password_env: "SMTP_PASSWORD"
  email_from_env: "EMAIL_FROM"
  email_to_env: "EMAIL_TO"
  require_tls: true

# Stage 3 Modules Configuration
swing_gate:
  enabled: true
  spy_symbol: "SPY"
  qqq_symbol: "QQQ"
  ema_fast: 20
  dma_medium: 50
  vix_low: 20.0
  vix_high: 25.0
  breadth_min_pct: 50.0
  breadth_defensive_pct: 40.0
  defensive_exceptions: false

theme_etfs:
  enabled: true
  items:
    - symbol: "SMH"
      name: "Semiconductors"
      category: "Technology"
    - symbol: "IGV"
      name: "Software"
      category: "Technology"
    - symbol: "AIQ"
      name: "AI & Tech Infrastructure"
      category: "Technology"
    - symbol: "XNTK"
      name: "Networking & Hardware"
      category: "Technology"
    - symbol: "OIH"
      name: "Energy Services"
      category: "Energy"
    - symbol: "XOP"
      name: "Oil & Gas E&P"
      category: "Energy"
    - symbol: "XLU"
      name: "Utilities"
      category: "Defensive"
    - symbol: "KRE"
      name: "Regional Banks"
      category: "Financials"
    - symbol: "XHB"
      name: "Homebuilders"
      category: "Cyclicals"
    - symbol: "XBI"
      name: "Biotechnology"
      category: "Healthcare"
    - symbol: "ITA"
      name: "Aerospace & Defense"
      category: "Industrials"

cross_assets_expanded:
  enabled: true
  items:
    - symbol: "CL=F"
      name: "Crude Oil (WTI)"
    - symbol: "BZ=F"
      name: "Brent Crude"
    - symbol: "NG=F"
      name: "Natural Gas"
    - symbol: "HG=F"
      name: "Copper"
    - symbol: "GC=F"
      name: "Gold"
    - symbol: "DX-Y.NYB"
      name: "US Dollar Index (DXY)"
    - symbol: "JPY=X"
      name: "USD/JPY"
    - symbol: "EURUSD=X"
      name: "EUR/USD"
    - symbol: "BTC-USD"
      name: "Bitcoin"

forward_calendar:
  enabled: true
  lookahead_days: 14
  high_impact_rules:
    - "fomc decision"
    - "fomc rate decision"
    - "fomc press conference"
    - "employment situation"
    - "nonfarm payrolls"
    - "consumer price index"
    - "cpi yoy"
    - "quarterly refunding"
    - "chair keynote"
    - "chair speech"
    - "chair testimony"
    - "general elections"

earnings:
  enabled: true
  top_constituents_count: 30
  lookahead_days: 7

sentiment:
  enabled: true
  realized_vol_window: 20


